<html lang="en">

<head>

  <meta name="description" content="Bindaas!! — Where Athletic Energy Meets Luxury Fashion" />

  <!-- ── Bindaas Brand Fonts ────────────────────────────── -->
  <!-- Playfair Display: luxury display headings -->
  <!-- Outfit: clean body / UI text -->
  <!-- Inter: numbers, labels -->
  <!-- Manrope: legacy / inline fallback -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,700&family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&family=Manrope:wght@200;300;400;500;600;700;800&display=swap"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,700&family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&family=Manrope:wght@200;300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- ── Material Icons ─────────────────────────────────── -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined|Material+Icons" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined|Material+Icons" rel="stylesheet" />

  <!-- ── Payment ────────────────────────────────────────── -->
  <script src="https://checkout.razorpay.com/v1/checkout.js" defer></script>

  <title>Bindaas!!</title>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <!-- NEXA AI Chat Widget — env-aware: localhost in dev, production URLs in prod -->
  <script>
    (function() {
      // Don't load the widget on admin pages
      if (window.location.pathname.startsWith('/admin')) return;

      var isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';

      window.NexaConfig = {
        ownerId: "system_admin",
        apiUrl: isLocalhost ? "http://localhost:8000" : (window.NEXA_API_URL || "https://nexa-api.bindaas.in")
      };

      var widgetSrc = isLocalhost
        ? "http://localhost:3000/nexa-widget.js"
        : (window.NEXA_WIDGET_URL || "https://cdn.bindaas.in/nexa-widget.js");

      var s = document.createElement('script');
      s.src = widgetSrc;
      s.async = true;
      document.head.appendChild(s);
    })();
  </script>
</body>

</html>
